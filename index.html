<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="个人导航页 - 搜索与常用站点聚合" />
<meta name="color-scheme" content="dark light" />
<title>我的导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Cpath d='M20 40l24-16M20 24h10M34 40h10' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  /* ============ 设计令牌 ============ */
  :root {
    --radius-sm: 10px;
    --radius: 16px;
    --radius-lg: 22px;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --font: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system,
      BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }

  html[data-theme="dark"] {
    --bg: #0a0c11;
    --surface: rgba(255, 255, 255, .045);
    --surface-hover: rgba(255, 255, 255, .08);
    --surface-solid: #14171f;
    --border: rgba(255, 255, 255, .09);
    --border-strong: rgba(255, 255, 255, .18);
    --text: #e9ebf2;
    --text-dim: #959db0;
    --shadow: 0 18px 40px -12px rgba(0, 0, 0, .7);
    --blob-1: #6366f1;
    --blob-2: #22d3ee;
    --blob-3: #a855f7;
    --blob-opacity: .3;
  }

  html[data-theme="light"] {
    --bg: #f5f6fa;
    --surface: rgba(255, 255, 255, .78);
    --surface-hover: #ffffff;
    --surface-solid: #ffffff;
    --border: rgba(16, 24, 40, .09);
    --border-strong: rgba(16, 24, 40, .2);
    --text: #15181f;
    --text-dim: #5d6679;
    --shadow: 0 16px 36px -14px rgba(16, 24, 40, .25);
    --blob-1: #818cf8;
    --blob-2: #67e8f9;
    --blob-3: #d8b4fe;
    --blob-opacity: .45;
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; scroll-padding-top: 90px; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background .4s var(--ease), color .4s var(--ease);
  }

  a { color: inherit; text-decoration: none; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

  /* 背景光斑 */
  .decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }

  .decor i {
    position: absolute;
    display: block;
    width: 46vw;
    height: 46vw;
    min-width: 320px;
    min-height: 320px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: var(--blob-opacity);
    animation: float 22s var(--ease) infinite alternate;
  }

  .decor i:nth-child(1) { background: var(--blob-1); top: -14%; left: -8%; }
  .decor i:nth-child(2) { background: var(--blob-2); top: 10%; right: -12%; animation-delay: -7s; }
  .decor i:nth-child(3) { background: var(--blob-3); bottom: -22%; left: 28%; animation-delay: -14s; }

  @keyframes float {
    to { transform: translate3d(4%, 6%, 0) scale(1.12); }
  }

  /* ============ 顶栏 ============ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px clamp(16px, 4vw, 48px);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid transparent;
    transition: border-color .3s, background .3s;
  }

  .topbar.scrolled { border-bottom-color: var(--border); }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }

  .brand-logo {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 6px 18px -6px var(--accent);
  }

  .brand-logo svg { width: 19px; height: 19px; }

  .spacer { flex: 1; }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    transition: all .25s var(--ease);
  }

  .icon-btn:hover {
    color: var(--text);
    background: var(--surface-hover);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }

  .icon-btn svg { width: 18px; height: 18px; }

  html[data-theme="dark"] .icon-sun { display: block; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="light"] .icon-sun { display: none; }
  html[data-theme="light"] .icon-moon { display: block; }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: .4px;
  }

  @media (max-width: 560px) { .clock { display: none; } }

  /* ============ 主体 ============ */
  main { width: min(1240px, 100%); margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 72px; }

  /* Hero */
  .hero { padding: clamp(40px, 8vh, 84px) 0 clamp(28px, 5vh, 48px); text-align: center; }

  .hero h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    letter-spacing: -.5px;
    line-height: 1.2;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p { margin: 0 0 30px; color: var(--text-dim); font-size: 15px; }

  /* 搜索 */
  .engines {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .engine {
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    border: 1px solid transparent;
    transition: all .22s var(--ease);
  }

  .engine:hover { color: var(--text); background: var(--surface); }

  .engine[aria-selected="true"] {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
  }

  .search {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(680px, 100%);
    margin: 0 auto;
    padding: 6px 6px 6px 20px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    transition: border-color .25s, box-shadow .25s, transform .25s var(--ease);
  }

  .search:focus-within {
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
  }

  .search svg.lens { width: 19px; height: 19px; color: var(--text-dim); flex: none; }

  .search input {
    flex: 1;
    min-width: 0;
    padding: 14px 0;
    border: 0;
    background: none;
    color: var(--text);
    font-size: 15.5px;
    outline: none;
  }

  .search input::placeholder { color: var(--text-dim); }

  .kbd {
    flex: none;
    padding: 3px 7px;
    border-radius: 7px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (max-width: 480px) { .kbd { display: none; } }

  .search button[type="submit"] {
    flex: none;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-2) 70%, var(--accent)));
    transition: filter .2s, transform .2s var(--ease);
  }

  .search button[type="submit"]:hover { filter: brightness(1.1); transform: translateY(-1px); }

  /* ============ 布局 ============ */
  .layout {
    display: grid;
    grid-template-columns: 184px minmax(0, 1fr);
    gap: clamp(20px, 3vw, 40px);
    align-items: start;
  }

  .side {
    position: sticky;
    top: 86px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .side a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--text-dim);
    transition: all .2s var(--ease);
  }

  .side a:hover { color: var(--text); background: var(--surface-hover); }

  .side a.active {
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    font-weight: 600;
  }

  .side a .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .45;
    flex: none;
  }

  .side a.active .dot { background: var(--accent); opacity: 1; }

  .side a .count { margin-left: auto; font-size: 12px; opacity: .6; font-variant-numeric: tabular-nums; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side {
      flex-direction: row;
      overflow-x: auto;
      scrollbar-width: none;
      top: 70px;
      z-index: 10;
    }
    .side::-webkit-scrollbar { display: none; }
    .side a { white-space: nowrap; }
    .side a .count { display: none; }
  }

  /* ============ 分类与卡片 ============ */
  .group { margin-bottom: 44px; scroll-margin-top: 90px; }

  .group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }

  .group-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.2px; }

  .group-head span { font-size: 13px; color: var(--text-dim); }

  .group-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(206px, 1fr));
    gap: 12px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform .28s var(--ease), border-color .28s, box-shadow .28s, background .28s;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120px 80px at var(--mx, 50%) var(--my, 0%),
        color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%);
    opacity: 0;
    transition: opacity .3s;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--border-strong);
    background: var(--surface-hover);
    box-shadow: var(--shadow);
  }

  .card:hover::before { opacity: 1; }

  .card .ico {
    position: relative;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 12px;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    overflow: hidden;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
  }

  .card .ico img {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 24px;
    height: 24px;
    border-radius: 5px;
    object-fit: contain;
  }

  .card .ico.has-icon {
    background: var(--surface-solid) !important;
  }

  .card .ico.has-icon .letter { display: none; }

  .card .meta { position: relative; min-width: 0; }

  .card .name {
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card .desc {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    padding: 56px 20px;
    text-align: center;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
  }

  .empty strong { color: var(--text); }

  footer {
    padding: 28px 0 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }

  .fade-in { animation: fadeIn .5s var(--ease) both; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="decor" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar" id="topbar">
  <a class="brand" href="#top">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M7 15l10-6M7 9h4M13 15h4" />
      </svg>
    </span>
    <span>洋仔的导航</span>
  </a>
  <span class="spacer"></span>
  <span class="clock" id="clock">--:--</span>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2" />
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8z" />
    </svg>
  </button>
</header>

<main id="top">
  <section class="hero">
    <h1><span id="greet">你好</span>，<em>开始探索吧</em></h1>
    <p>一个搜索框，一组常用站点，足够应付大半天的工作</p>

    <div class="engines" role="tablist" aria-label="搜索引擎"></div>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
      </svg>
      <input id="q" type="search" placeholder="搜索网络，或直接输入站点名称筛选…" aria-label="搜索" />
      <span class="kbd">Ctrl K</span>
      <button type="submit">搜索</button>
    </form>
  </section>

  <div class="layout">
    <nav class="side" id="sideNav" aria-label="分类导航"></nav>
    <div id="content"></div>
  </div>

  <footer>Copyright 2026 YangZai All Rights Reserved</footer>
</main>

<script>
/* =========================================================
   站点数据：按分类维护，新增条目直接加对象即可
   ========================================================= */
const SITES = [

      { name: "豆瓣",           url: "https://www.douban.com",        desc: "书影音与小组" },
      { name: "Medium",         url: "https://medium.com",            desc: "英文长文平台" },
      { name: "OSChina",         url: "https://oschina.net",            desc: "开源技术交流" },
      { name: "arXiv",          url: "https://arxiv.org",             desc: "论文预印本" }
    ]
  },
  {
    cat: "信息工具",
    items: [
      { name: "DeepL",        url: "https://www.deepl.com/translator", desc: "高质量翻译" },

      { name: "it-tools",     url: "https://it-tools.tech",            desc: "开发者工具合集" },
      { name: "Wolfram Alpha",url: "https://www.wolframalpha.com",     desc: "计算知识引擎" },
      { name: "Google Trends",url: "https://trends.google.com",        desc: "搜索热度趋势" },
      { name: "BeJson",      url: "https://www.bejson.com",            desc: "JSON格式校验" },
      { name: "GestIOIP",     url: "http://www.gestioip.net/cgi-bin/subnet_calculator.cgi",            desc: "IP子网计算" },
      { name: "YamlLint",url: "https://www.yamllint.com",              desc: "YAML格式校验" },

    ]
  }

/* 搜索引擎 */
const ENGINES = [
  { id: "bing",   name: "Bing",   url: "https://www.bing.com/search?q=" },
  { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
  { id: "baidu",  name: "百度",   url: "https://www.baidu.com/s?wd=" },
  { id: "github", name: "GitHub", url: "https://github.com/search?q=" },
  { id: "zhihu",  name: "知乎",   url: "https://www.zhihu.com/search?q=" }
];

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- 主题 ---------- */
(function initTheme() {
  const saved = store.get("nav-theme");
  const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
})();

$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("nav-theme", next);
});

/* ---------- 时钟与问候 ---------- */
function tick() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  $("#clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const h = d.getHours();
  $("#greet").textContent =
    h < 6 ? "凌晨好" : h < 11 ? "早上好" : h < 14 ? "中午好" : h < 18 ? "下午好" : h < 23 ? "晚上好" : "夜深了";
}
tick();
setInterval(tick, 10000);

/* ---------- 搜索引擎切换 ---------- */
let engine = ENGINES.find(e => e.id === store.get("nav-engine", "bing")) || ENGINES[0];

function renderEngines() {
  $(".engines").innerHTML = ENGINES.map(e => `
    <button class="engine" type="button" role="tab" data-id="${e.id}"
      aria-selected="${e.id === engine.id}">${e.name}</button>`).join("");
}
renderEngines();

$(".engines").addEventListener("click", ev => {
  const btn = ev.target.closest(".engine");
  if (!btn) return;
  engine = ENGINES.find(e => e.id === btn.dataset.id);
  store.set("nav-engine", engine.id);
  renderEngines();
  $("#q").focus();
});

$("#searchForm").addEventListener("submit", ev => {
  ev.preventDefault();
  const kw = $("#q").value.trim();
  if (!kw) return;
  window.open(engine.url + encodeURIComponent(kw), "_blank", "noopener");
});

/* ---------- 渲染卡片 ---------- */
const host = url => { try { return new URL(url).hostname; } catch { return ""; } };
const HUES = [222, 258, 190, 340, 25, 160, 285, 205];
const hueOf = s => HUES[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];

function cardHTML(it) {
  const h = host(it.url);
  const hue = hueOf(it.name);
  const letter = it.name[0].toUpperCase();
  return `
  <a class="card" href="${it.url}" target="_blank" rel="noopener noreferrer"
     data-key="${(it.name + " " + it.desc + " " + h).toLowerCase()}" title="${it.name} · ${it.desc}">
    <span class="ico" style="background:linear-gradient(135deg,hsl(${hue} 70% 55%),hsl(${hue + 28} 72% 46%))">
      <span class="letter">${letter}</span>
      <img src="https://favicon.im/${h}?larger=true" alt="" loading="lazy"
           data-fallback="https://www.google.com/s2/favicons?domain=${h}&amp;sz=64" />
    </span>
    <span class="meta">
      <span class="name">${it.name}</span>
      <span class="desc">${it.desc}</span>
    </span>
  </a>`;
}

/* favicon 两级降级：favicon.im → Google S2 → 字母占位 */
function bindFavicons() {
  $$(".card .ico img").forEach(img => {
    img.addEventListener("load", () => img.parentElement.classList.add("has-icon"));
    img.addEventListener("error", () => {
      const fb = img.dataset.fallback;
      if (fb) { img.dataset.fallback = ""; img.src = fb; }
      else { img.remove(); }
    });
    if (img.complete && img.naturalWidth > 0) img.parentElement.classList.add("has-icon");
  });
}

function render() {
  $("#content").innerHTML = SITES.map((g, i) => `
    <section class="group fade-in" id="cat-${i}" style="animation-delay:${i * 70}ms">
      <div class="group-head">
        <h2>${g.cat}</h2><span>${g.items.length} 个站点</span>
      </div>
      <div class="grid">${g.items.map(cardHTML).join("")}</div>
    </section>`).join("") + `<div class="empty" id="empty" hidden>没有匹配的站点，按 <strong>Enter</strong> 用 ${engine.name} 搜索</div>`;

  $("#sideNav").innerHTML = SITES.map((g, i) => `
    <a href="#cat-${i}" data-i="${i}">
      <span class="dot"></span><span>${g.cat}</span><span class="count">${g.items.length}</span>
    </a>`).join("");

  observeGroups();
  bindFavicons();
}

/* 卡片光晕跟随鼠标 */
$("#content").addEventListener("pointermove", ev => {
  const card = ev.target.closest(".card");
  if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty("--mx", `${ev.clientX - r.left}px`);
  card.style.setProperty("--my", `${ev.clientY - r.top}px`);
});

/* ---------- 输入即筛选 ---------- */
$("#q").addEventListener("input", () => {
  const kw = $("#q").value.trim().toLowerCase();
  let total = 0;
  $$(".group").forEach(g => {
    let shown = 0;
    $$(".card", g).forEach(c => {
      const hit = !kw || c.dataset.key.includes(kw);
      c.hidden = !hit;
      if (hit) shown++;
    });
    g.hidden = shown === 0;
    total += shown;
  });
  $("#empty").hidden = total !== 0;
});

/* ---------- 侧栏高亮 ---------- */
let io;
function observeGroups() {
  io?.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      $$("#sideNav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === `#${e.target.id}`));
    });
  }, { rootMargin: "-90px 0px -65% 0px" });
  $$(".group").forEach(g => io.observe(g));
}

/* ---------- 快捷键 ---------- */
document.addEventListener("keydown", ev => {
  const typing = /^(INPUT|TEXTAREA)$/.test(ev.target.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") {
    ev.preventDefault(); $("#q").focus(); $("#q").select();
  } else if (ev.key === "/" && !typing) {
    ev.preventDefault(); $("#q").focus();
  } else if (ev.key === "Escape" && typing) {
    $("#q").value = ""; $("#q").dispatchEvent(new Event("input")); $("#q").blur();
  }
});

/* ---------- 顶栏阴影 ---------- */
const onScroll = () => $("#topbar").classList.toggle("scrolled", window.scrollY > 8);
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();

render();
</script>
</body>
</html>
